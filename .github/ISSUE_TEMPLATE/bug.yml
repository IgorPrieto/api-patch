name: Fallo de instalación o uso
description: Un comando o el panel falla o muestra un resultado inesperado.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "No adjuntes secretos, OpenAPI privados ni código de terceros sin permiso. Para vulnerabilidades usa SECURITY.md."
  - type: input
    id: version
    attributes:
      label: Versión de APIPatch y Node.js
      placeholder: "0.1.0-beta.2; Node 24.x"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Sistema operativo
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir con datos sintéticos
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Resultado observado y esperado
    validations:
      required: true
