# Explicit, human-confirmed mappings for the synthetic demo. Nothing here is inferred.
# Operation ids are ApiOperation.id values (stableId of method + route):
#   operation_0c18aa94f3dba7ba4b44e270 = GET /users/{id}   (v1 only)
#   operation_25aeeca43a7e0da11c3af7a6 = GET /members/{id} (v2 only)
#   operation_51c5dc335bf5e04397a10573 = POST /users       (v1 and v2)
# GET /preferences (oneOf response) has no mapping on purpose: it stays pending for review.
# allowedOrigins is empty because the consumer uses same-origin relative URLs.
schemaVersion: '1.0'
allowedOrigins: []
operations:
  - { from: operation_0c18aa94f3dba7ba4b44e270, to: operation_25aeeca43a7e0da11c3af7a6 }
renames:
  - { operationId: operation_25aeeca43a7e0da11c3af7a6, location: query, from: locale, to: lang }
  - { operationId: operation_25aeeca43a7e0da11c3af7a6, location: response, from: fullName, to: displayName }
  - { operationId: operation_51c5dc335bf5e04397a10573, location: request, from: name, to: displayName }
values:
  - { operationId: operation_51c5dc335bf5e04397a10573, location: request, name: tenantId, value: tenant-demo }
