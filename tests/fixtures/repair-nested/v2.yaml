openapi: 3.1.0
info: { title: APIPatch nested repair fixture, version: 2.0.0 }
servers:
  - url: http://127.0.0.1:4010
paths:
  /orders:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item, shipping]
              properties:
                item: { type: string }
                shipping:
                  type: object
                  required: [address]
                  properties:
                    address:
                      allOf:
                        - type: object
                          required: [town, country]
                          properties: { town: { type: string }, street: { type: string } }
                        - type: object
                          properties: { country: { type: string, enum: [ES, PT] } }
                options:
                  oneOf:
                    - { type: object, properties: { gift: { type: boolean } } }
                    - { type: object, properties: { express: { type: boolean } } }
                lines:
                  type: array
                  items: { type: object, properties: { sku: { type: string } } }
                labels:
                  type: object
                  additionalProperties: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { type: object, properties: { id: { type: string } } }
  /profiles/{id}:
    get:
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  displayName: { type: string }
                  address:
                    type: object
                    properties: { town: { type: string }, zip: { type: string } }
  /people/{id}:
    get:
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Person
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  address:
                    type: object
                    required: [town]
                    properties: { zip: { type: string }, town: { type: string } }
