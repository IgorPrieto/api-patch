openapi: 3.1.0
info: { title: Compare dialect fixture, version: 2.0.0 }
paths:
  /readings:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                value: { type: number, exclusiveMinimum: 0 }
                comment: { type: [string, 'null'] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [unit]
                properties:
                  unit: { type: [string, 'null'] }
