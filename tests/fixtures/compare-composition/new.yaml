openapi: 3.1.0
info: { title: Composition fixture, version: '2' }
paths:
  /tree:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Node' }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Node' }
      responses:
        '204': { description: Created }
components:
  schemas:
    # The top level is unchanged; only nodes reached through `next` changed.
    Node:
      type: object
      required: [name]
      properties:
        name: { type: string }
        next: { $ref: '#/components/schemas/Child' }
    Child:
      type: object
      required: [name]
      properties:
        name: { type: integer }
        next: { $ref: '#/components/schemas/Child' }
